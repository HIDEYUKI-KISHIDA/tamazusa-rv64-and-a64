# /etc/io.conf — 入出力の名前と、実物の結びつけ（機械を据え付けた人が書く）
#
#   名前 = 実物 [min 値] [max 値] [speed 度/秒] [scale 倍率] [offset 値] [input|output] [unit 単位]
#   実物: vio.adcN・vio.pwmN・vio.servoN・vio.pinN（仮想の機器）
#         usbio.pinN・usbio.adcN・usbio.pwmN・usbio.servoN（USB の I/O ボード。N はボードのピンの番号）
#         som.pinN・som.pwmN・som.servoN（SoM のピン。gpioN・pwmN と書いてもよい）
#   min・max は出力の上限（プログラムはこれを超えられない）。scale・offset は 物の値 = 生の値 × scale + offset
#   このファイルは起動のときに 1 回だけ読む。
#
# 誰が動かせるか（安全の決まり 6）。読むのは誰でもできる。止める（ESTOP）のも誰でもできる。
#   access group N   動かしてよいグループの番号（root はいつもよい。既定は 20 = /etc/group の io）
#   network deny     ネットワークのソケットを開いたプロセスとその子（ssh で入った人など）は動かせない（既定）
#   network allow    ネットワークからも動かしてよい（機械の持ち主が、危険がないと判断したときだけ）
access group 20
network deny
#
#
# 仮想の機器（センサー）
TEMP   = vio.adc0  unit C
HUMID  = vio.adc1  unit %
LEVEL  = vio.adc2  unit mm
DIST   = vio.adc3  unit mm
LIGHT  = vio.adc4  unit lx
SOUND  = vio.adc5  unit dB
TOUCH  = vio.adc6
CO2    = vio.adc7  unit ppm
PH     = vio.adc8
# 仮想の機器（アクチュエータ・出力）
HEATER = vio.pwm0
FAN    = vio.pwm1
PUMP   = vio.pwm2
LAMP   = vio.pwm3
MOTOR  = vio.pwm4
LED0   = vio.pin0
LED1   = vio.pin1
LED2   = vio.pin2
# 仮想のロボットアーム（上限の例: 肩は -90〜90 度、毎秒 180 度まで）
ARM0   = vio.servo0  min -90  max 90  speed 180
ARM1   = vio.servo1  min -90  max 90  speed 180
ARM2   = vio.servo2  min -90  max 90  speed 180
# USB の I/O ボード（Firmata）をつないだとき
BLED   = usbio.pin13
BBTN   = usbio.pin2   input
BKNOB  = usbio.adc0   scale 0.09775  unit %
BDIM   = usbio.pwm3
BSERVO = usbio.servo9  min 0  max 180
BSENSE1 = usbio.adc1
BSENSE2 = usbio.adc2
